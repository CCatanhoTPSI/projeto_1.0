<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body>
        <header>
            <h1>Inscrição no Clube de Fotografia</h1>
            <nav>
                <a href="index.html">Sobre mim</a>
            </nav>
        </header>
        <h1>Inscrição</h1>
        <p>Os campos obrigatórios estão assinalados com «(obrigatório)».</p>
        <main>

            <form action="#" method="post">

                <label for="nome">Nome: </label><input type="text" id="nome" name="nome" required autocomplete="name" /></label>
                <label for="email">E-mail: </label><input type="email" id="email" name="email" required autocomplete="email" /></label>
                <label for="telemovel">Telemóvel: </label><input type="tel" id="telemovel" name="telemovel" autocomplete="tel" /></label>

                <select id="course" name="course" required>
                        <option value="">Escolhe o teu curso:</option>
                        <option value="curso1 ">Curso 1</option>
                        <option value="curso2">Curso 2</option>
                        <option value="curso3">Curso 3</option>
                </select>

                 <fieldset>
                    <legend>Ano</legend>
                    <input type="radio" id="primeiro" name="ano" value="primeiro" required />
                    <label for="primeiro">1.º Ano</label>
                    <input type="radio" id="segundo" name="ano" value="segundo" />
                    <label for="segundo">2.º Ano</label>
                    <input type="radio" id="terceiro" name="ano" value="terceiro" />
                    <label for="terceiro">3.º Ano</label>
                </fieldset>


            <!-- TODO 7: Ano. Um fieldset com legend «Ano» e 3 botões de rádio
            (1.º, 2.º, 3.º) com o mesmo name. Cada rádio tem o seu label. -->

            <!-- TODO 8: Interesses. Um fieldset com legend e pelo menos 4 caixas de
            verificação (retrato, paisagem, rua, edição, ...). -->

            <!-- TODO 9: textarea «Porque queres entrar no clube?», com um texto de
            ajuda ligado por aria-describedby. -->

            <!-- TODO 10: caixa de verificação de consentimento obrigatória:
            «Autorizo o uso dos meus dados apenas para gerir a inscrição». -->

            <!-- TODO 11: botão de envio (button type="submit") com texto claro. -->
            </form>
        </main>

    <!-- TODO 12: rodapé (footer) com o contacto do clube. -->
  </body>
</html>
